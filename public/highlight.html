<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面图标高亮</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      .halo {
        box-sizing: border-box;
        position: relative;
        width: calc(100vw - 18px);
        height: calc(100vh - 18px);
        margin: 9px;
        border-radius: 16px;
        background: transparent;
        box-shadow: 0 0 18px 5px rgba(255, 216, 77, 0.42);
        animation: pulse 0.42s ease-in-out infinite alternate;
      }

      .halo::before,
      .halo::after {
        position: absolute;
        inset: 0;
        content: "";
        border-color: rgba(255, 216, 77, 0.98);
        border-style: solid;
        border-radius: 16px;
        pointer-events: none;
      }

      .halo::before {
        border-width: 4px 0 0 4px;
        clip-path: polygon(0 0, 42px 0, 42px 4px, 4px 4px, 4px 42px, 0 42px);
        filter: drop-shadow(0 0 6px rgba(255, 216, 77, 0.85));
      }

      .halo::after {
        border-width: 0 4px 4px 0;
        clip-path: polygon(
          calc(100% - 42px) calc(100% - 4px),
          calc(100% - 4px) calc(100% - 4px),
          calc(100% - 4px) calc(100% - 42px),
          100% calc(100% - 42px),
          100% 100%,
          calc(100% - 42px) 100%
        );
        filter: drop-shadow(0 0 6px rgba(255, 216, 77, 0.85));
      }

      @keyframes pulse {
        from {
          transform: scale(0.96);
          opacity: 0.82;
        }

        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="halo"></div>
  </body>
</html>
